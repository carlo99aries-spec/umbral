# Umbral — Docker Compose
#
#   docker compose up -d --build          # db + app (app bound to 127.0.0.1:APP_PORT)
#   docker compose --profile tls up -d    # adds a Caddy on 80/443 (only if free)
#
# If the host already has a reverse proxy owning 80/443 (the usual case on a
# shared VPS), do NOT use the tls profile. Instead let the app join that
# proxy's Docker network via UMBRAL_EDGE_NETWORK and point the proxy at
# `umbral-app:3000`.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: umbral
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: umbral
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umbral -d umbral"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - umbral

  umbral-app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: umbral-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://umbral:${POSTGRES_PASSWORD}@db:5432/umbral?schema=public
      NEXT_PUBLIC_BASE_URL: ${PUBLIC_URL:?PUBLIC_URL is required}
      NODE_ENV: production
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - umbral
      # Joined so an existing edge proxy can reach `umbral-app:3000` by name.
      - edge

  # Optional. Only start this if ports 80/443 are free on the host.
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      - umbral-app
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Only used by the optional tls profile. Set DOMAIN in .env to enable it.
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ../deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - umbral

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  umbral:
  edge:
    external: true
    name: ${UMBRAL_EDGE_NETWORK:-vps_app}
